services:
  # 1. Reverse Proxy (Nginx)
  nginx:
    image: nginx:1.25-alpine
    container_name: iot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - API_DOMAIN=${API_DOMAIN:-localhost}
    volumes:
      - ./config/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - backend
      - supabase-envoy
    networks:
      - iot_net

  # 2. MQTT Broker (Eclipse Mosquitto)
  mosquitto:
    image: eclipse-mosquitto@sha256:d12c8f80dfc65b768bb9acecc7ef182b976f71fb681640b66358e5e0cf94e9e9
    user: "1883:1883"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/usr/sbin/mosquitto"]
    command: ["-c", "/mosquitto/config/mosquitto.conf"]
    depends_on:
      mosquitto-auth-init:
        condition: service_completed_successfully
    container_name: iot_mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
      - "8883:8883"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_auth:/mosquitto/auth:ro
      - ./config/mosquitto/acl:/mosquitto/config/acl:ro
      - ./config/mosquitto/certs:/mosquitto/config/certs:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - iot_net

  # Root is confined to fresh named-volume roots; init then drops UID/GID.
  mosquitto-auth-init:
    build:
      context: ./src
      target: auth-init
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=1m,mode=0700,uid=1883,gid=1883"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-backend_service}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD is required}
    volumes:
      - mosquitto_auth:/mosquitto/auth
      - mosquitto_control:/mosquitto/control

  mosquitto-reloader:
    build:
      context: ./src
      target: reloader
    user: "1883:1883"
    restart: unless-stopped
    network_mode: none
    pid: service:mosquitto
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MQTT_RELOAD_SOCKET: /mosquitto/control/reload.sock
      MQTT_RELOAD_TIMEOUT: ${MQTT_RELOAD_TIMEOUT:-2s}
      MQTT_RELOAD_MAX_CONNECTIONS: ${MQTT_RELOAD_MAX_CONNECTIONS:-8}
    volumes:
      - mosquitto_control:/mosquitto/control
    depends_on:
      mosquitto:
        condition: service_started

  # portmap_openvpn:
  #   image: alpine:latest
  #   container_name: portmap_openvpn
  #   cap_add:
  #     - NET_ADMIN
  #   devices:
  #     - /dev/net/tun
  #   volumes:
  #     - ./mqtt_portmap.ovpn:/config.ovpn:ro
  #   command: >
  #     sh -c "
  #     apk add --no-cache openvpn socat && 
  #     openvpn --config /config.ovpn --daemon && 
  #     echo 'VPN started, forwarding port 8883...' &&
  #     socat TCP-LISTEN:8883,fork,reuseaddr TCP:mosquitto:8883
  #     "
  #   networks:
  #     - iot_net
  #   restart: unless-stopped
  #   depends_on:
  #     - mosquitto
  #   profiles:
  #     - production
  #     - tcp_tunnel

  rathole:
    image: rapiz1/rathole:v0.5.0
    container_name: iot_rathole
    volumes:
      - ./client_rathole.toml:/app/config.toml
    command: "/app/config.toml"
    networks:
      - iot_net
    restart: unless-stopped
    depends_on:
      - mosquitto



  # 3. Database: PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb@sha256:289d55704b1b3ee8263cd3805c6930f9cd54506835a8f19f9b85dad17d5c5a8a
    container_name: iot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-iot_platform}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD:?STORAGE_DB_PASSWORD is required}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?BACKEND_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - iot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-iot_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Provision or rotate Supabase database roles on both new and existing volumes.
  supabase-role-provisioner:
    image: timescale/timescaledb@sha256:289d55704b1b3ee8263cd3805c6930f9cd54506835a8f19f9b85dad17d5c5a8a
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-iot_platform}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD:?STORAGE_DB_PASSWORD is required}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?BACKEND_DB_PASSWORD is required}
    volumes:
      - ./migrations/000000_configure_supabase_roles.sh:/migrations/000000_configure_supabase_roles.sh:ro
    command: ["/bin/sh", "/migrations/000000_configure_supabase_roles.sh"]
    networks:
      - iot_net

  # Apply tracked application migrations to both new and existing volumes.
  application-migrations:
    image: timescale/timescaledb@sha256:289d55704b1b3ee8263cd3805c6930f9cd54506835a8f19f9b85dad17d5c5a8a
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      supabase-role-provisioner:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-iot_platform}
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/run-migrations.sh:/run-migrations.sh:ro
    command: ["/bin/sh", "/run-migrations.sh"]
    networks:
      - iot_net

  # 4. Supabase API Gateway (Envoy - aliased as kong for backwards compatibility)
  supabase-envoy:
    image: envoyproxy/envoy:v1.39.1
    container_name: supabase_envoy
    restart: unless-stopped
    depends_on:
      - supabase-auth
      - supabase-storage
    volumes:
      - ./config/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./config/envoy/cds.yaml:/etc/envoy/cds.yaml:ro
      - ./config/envoy/lds.template.yaml:/etc/envoy/lds.template.yaml:ro
      - ./config/envoy/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-admin}
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    networks:
      iot_net:
        aliases:
          - envoy
          - kong

  # 5. Supabase Auth (GoTrue)
  supabase-auth:
    image: supabase/gotrue:v2.196.0
    container_name: supabase_auth
    restart: unless-stopped
    depends_on:
      supabase-role-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 10s
      retries: 3
    environment:
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:-http://localhost}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-iot_platform}
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-http://localhost}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-true}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: ${SUPABASE_JWT_AUDIENCE:?SUPABASE_JWT_AUDIENCE is required}
      GOTRUE_JWT_ISSUER: ${GOTRUE_JWT_ISSUER:?GOTRUE_JWT_ISSUER is required}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true" # Tắt xác nhận email theo yêu cầu
    networks:
      iot_net:
        aliases:
          - auth

  # Apply application constraints that depend on GoTrue's auth.users table.
  supabase-compat-migration:
    image: timescale/timescaledb@sha256:289d55704b1b3ee8263cd3805c6930f9cd54506835a8f19f9b85dad17d5c5a8a
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      supabase-auth:
        condition: service_healthy
      application-migrations:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./migrations/000004_supabase_compat.up.sql:/migrations/000004_supabase_compat.up.sql:ro
    command:
      - /bin/sh
      - -ec
      - psql -h postgres -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-iot_platform}" -f /migrations/000004_supabase_compat.up.sql
    networks:
      - iot_net

  # 6. Supabase Storage API
  supabase-storage:
    image: supabase/storage-api:v1.74.0
    container_name: supabase_storage
    restart: unless-stopped
    depends_on:
      supabase-role-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      timeout: 5s
      interval: 10s
      retries: 3
    volumes:
      - storage_data:/var/lib/storage
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${STORAGE_DB_PASSWORD:?STORAGE_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-iot_platform}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-iot-storage}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost}
      TENANT_ID: default
      REGION: local
      POSTGREST_URL: http://rest:3000
    networks:
      iot_net:
        aliases:
          - storage

  # 7. Go Backend Server (Modular Monolith)
  backend:
    build:
      context: ./src
      dockerfile: Dockerfile
      target: backend
    user: "1883:1883"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=1m,mode=0700,uid=1883,gid=1883"]
    volumes:
      - mosquitto_auth:/mosquitto/auth
      - mosquitto_control:/mosquitto/control:ro
      - ./config/mosquitto/certs:/mosquitto/config/certs:ro
    container_name: iot_backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SERVER_ENV: ${SERVER_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      DATABASE_MIN_CONNS: ${DATABASE_MIN_CONNS:-1}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-10s}
      READINESS_TIMEOUT: ${READINESS_TIMEOUT:-2s}
      AUTHORIZATION_TIMEOUT: ${AUTHORIZATION_TIMEOUT:-2s}
      ADMIN_MAX_BODY_BYTES: ${ADMIN_MAX_BODY_BYTES:-16384}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-ssl://mosquitto:8883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-backend_monolith}
      MQTT_USERNAME: ${MQTT_USERNAME:-backend_service}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD is required}
      MQTT_QUEUE_CAPACITY: ${MQTT_QUEUE_CAPACITY:-256}
      MQTT_WORKER_COUNT: ${MQTT_WORKER_COUNT:-4}
      MQTT_MAX_PAYLOAD_BYTES: ${MQTT_MAX_PAYLOAD_BYTES:-1048576}
      MQTT_CREDENTIAL_RUNTIME_ENABLED: ${MQTT_CREDENTIAL_RUNTIME_ENABLED:-true}
      MQTT_AUTH_DIR: /mosquitto/auth
      MQTT_RELOAD_SOCKET: /mosquitto/control/reload.sock
      MOSQUITTO_PASSWD_PATH: /usr/bin/mosquitto_passwd
      MQTT_TLS_CA_FILE: ${MQTT_TLS_CA_FILE:-/mosquitto/config/certs/ca.crt}
      MQTT_CREDENTIAL_OPERATION_TIMEOUT: ${MQTT_CREDENTIAL_OPERATION_TIMEOUT:-10s}
      MQTT_PASSWORD_TOOL_TIMEOUT: ${MQTT_PASSWORD_TOOL_TIMEOUT:-3s}
      MQTT_RELOAD_TIMEOUT: ${MQTT_RELOAD_TIMEOUT:-2s}
      MQTT_CREDENTIAL_PROBE_TIMEOUT: ${MQTT_CREDENTIAL_PROBE_TIMEOUT:-3s}
      MQTT_CREDENTIAL_RECOVERY_TIMEOUT: ${MQTT_CREDENTIAL_RECOVERY_TIMEOUT:-5s}
      MQTT_CREDENTIAL_MAX_FILE_BYTES: ${MQTT_CREDENTIAL_MAX_FILE_BYTES:-1048576}
      MQTT_CREDENTIAL_MAX_PENDING: ${MQTT_CREDENTIAL_MAX_PENDING:-8}
      SUPABASE_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SUPABASE_JWT_ISSUER: ${GOTRUE_JWT_ISSUER:?GOTRUE_JWT_ISSUER is required}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:?SUPABASE_JWT_AUDIENCE is required}
      SUPABASE_JWT_CLOCK_SKEW: ${SUPABASE_JWT_CLOCK_SKEW:-30s}
      SUPABASE_URL: "http://supabase-envoy:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      mosquitto-reloader:
        condition: service_started
      mosquitto-auth-init:
        condition: service_completed_successfully
      supabase-compat-migration:
        condition: service_completed_successfully
      application-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - iot_net

  # 8. Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:1920-fe70e951a3c5
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - iot_net
    profiles:
      - production
      - http_tunnel

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_auth:
  mosquitto_control:
  storage_data:

networks:
  iot_net:
    driver: bridge
