version: '3.8'

services:
  # 1. Reverse Proxy (Nginx)
  nginx:
    image: nginx:1.25-alpine
    container_name: iot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - API_DOMAIN=${API_DOMAIN:-localhost}
    volumes:
      - ./config/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - backend
      - supabase-envoy
    networks:
      - iot_net

  # 2. MQTT Broker (Eclipse Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: iot_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./config/mosquitto/acl:/mosquitto/config/acl:ro
      - ./config/mosquitto/certs:/mosquitto/config/certs:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - iot_net

  # portmap_openvpn:
  #   image: alpine:latest
  #   container_name: portmap_openvpn
  #   cap_add:
  #     - NET_ADMIN
  #   devices:
  #     - /dev/net/tun
  #   volumes:
  #     - ./mqtt_portmap.ovpn:/config.ovpn:ro
  #   command: >
  #     sh -c "
  #     apk add --no-cache openvpn socat && 
  #     openvpn --config /config.ovpn --daemon && 
  #     echo 'VPN started, forwarding port 8883...' &&
  #     socat TCP-LISTEN:8883,fork,reuseaddr TCP:mosquitto:8883
  #     "
  #   networks:
  #     - iot_net
  #   restart: unless-stopped
  #   depends_on:
  #     - mosquitto
  #   profiles:
  #     - production
  #     - tcp_tunnel

  rathole:
    image: rapiz1/rathole:v0.5.0
    container_name: iot_rathole
    volumes:
      - ./client_rathole.toml:/app/config.toml
    command: "/app/config.toml"
    networks:
      - iot_net
    restart: unless-stopped
    depends_on:
      - mosquitto



  # 3. Database: PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: iot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-iot_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - iot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-iot_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Supabase API Gateway (Envoy - aliased as kong for backwards compatibility)
  supabase-envoy:
    image: envoyproxy/envoy:v1.39.1
    container_name: supabase_envoy
    restart: unless-stopped
    depends_on:
      - supabase-auth
      - supabase-storage
    volumes:
      - ./config/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./config/envoy/cds.yaml:/etc/envoy/cds.yaml:ro
      - ./config/envoy/lds.template.yaml:/etc/envoy/lds.template.yaml:ro
      - ./config/envoy/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-admin}
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    networks:
      iot_net:
        aliases:
          - envoy
          - kong

  # 5. Supabase Auth (GoTrue)
  supabase-auth:
    image: supabase/gotrue:v2.196.0
    container_name: supabase_auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 10s
      retries: 3
    environment:
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:-http://localhost}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-iot_platform}
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-http://localhost}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true" # Tắt xác nhận email theo yêu cầu
    networks:
      iot_net:
        aliases:
          - auth

  # 6. Supabase Storage API
  supabase-storage:
    image: supabase/storage-api:v1.74.0
    container_name: supabase_storage
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      timeout: 5s
      interval: 10s
      retries: 3
    volumes:
      - storage_data:/var/lib/storage
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-iot_platform}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-iot-storage}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost}
      TENANT_ID: default
      REGION: local
      POSTGREST_URL: http://rest:3000
    networks:
      iot_net:
        aliases:
          - storage

  # 7. Go Backend Server (Modular Monolith)
  backend:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: iot_backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SERVER_ENV: ${SERVER_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/iot_platform?sslmode=disable}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://mosquitto:1883}
      MQTT_CLIENT_ID: "backend_monolith"
      MQTT_USERNAME: "backend_service"
      MQTT_PASSWORD: "backend_secret"
      SUPABASE_JWT_SECRET: ${JWT_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_URL: "http://supabase-envoy:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - iot_net

  # 8. Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:1920-fe70e951a3c5
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - iot_net
    profiles:
      - production
      - http_tunnel

volumes:
  postgres_data:
  mosquitto_data:
  storage_data:

networks:
  iot_net:
    driver: bridge
