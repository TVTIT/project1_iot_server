version: '3.8'

services:
  # 1. Reverse Proxy (Nginx)
  nginx:
    image: nginx:1.25-alpine
    container_name: iot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - API_DOMAIN=${API_DOMAIN:-localhost}
    volumes:
      - ./config/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - backend
    networks:
      - iot_net

  # 2. MQTT Broker (Eclipse Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: iot_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./config/mosquitto/acl:/mosquitto/config/acl:ro
      - ./config/mosquitto/certs:/mosquitto/config/certs:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - iot_net

  portmap_openvpn:
    image: alpine:latest
    container_name: portmap_openvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./mqtt_portmap.ovpn:/config.ovpn:ro
    command: >
      sh -c "
      apk add --no-cache openvpn socat && 
      openvpn --config /config.ovpn --daemon && 
      echo 'VPN started, forwarding port 1883...' &&
      socat TCP-LISTEN:1883,fork,reuseaddr TCP:mosquitto:1883
      "
    networks:
      - iot_net
    restart: unless-stopped
    depends_on:
      - mosquitto

  # 3. Database: PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: iot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-iot_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432" # Bound locally for management/debug
    networks:
      - iot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-iot_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Go Backend Server (Modular Monolith)
  backend:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: iot_backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SERVER_ENV: ${SERVER_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/iot_platform?sslmode=disable}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://mosquitto:1883}
      MQTT_CLIENT_ID: "backend_monolith"
      MQTT_USERNAME: "backend_service"
      MQTT_PASSWORD: "backend_secret"
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-secret}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - iot_net

  # 5. Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:1920-fe70e951a3c5
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - iot_net

volumes:
  postgres_data:
  mosquitto_data:

networks:
  iot_net:
    driver: bridge
