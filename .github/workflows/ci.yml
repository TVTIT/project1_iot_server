name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

defaults:
  run:
    working-directory: ./src

jobs:
  stage2-e2e:
    name: Legacy E2E contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: src/go.sum
      - name: Check prerequisites
        run: |
          mkdir -p /tmp/opencode
          python3 --version
          openssl version
          docker version
          docker compose version
          go version
      - name: Test harness
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_stage2_ci.py'
          python3 -m unittest discover -s scripts/tests -p 'test_stage2_ci_functional.py'
          python3 -m unittest discover -s scripts/tests -p 'test_stage2_response_loss.py'
      - name: Legacy execution deferred notice
        run: |
          notice=$(printf '%s\n' \
            "legacy-execution-deferred: stage2-e2e" \
            "Omitted native scenario: legacy E2E supervisor runs (stage2_ci native execution)." \
            "Known unresolved failure: historical remote run failed before scenarios (exact cause hidden; shared controller-coupled expectations)." \
            "Current replacement verification jobs: native-compose-smoke and dynsec-native-integration.")
          printf '%s\n' "$notice"
          printf '%s\n' "$notice" >> "$GITHUB_STEP_SUMMARY"

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: src/go.sum
      - name: Format check
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"
      - name: Lint (go vet)
        run: go vet ./...
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ./src
          args: --timeout=5m
      - name: Test CI guards
        working-directory: .
        run: |
          python3 -m unittest scripts/tests/test_ci_go_test_guard.py
          python3 -m unittest scripts/tests/test_ci_feature_jobs.py
      - name: Unit tests
        run: |
          prev_umask=$(umask)
          umask 077
          temp_dir="$(mktemp -d "${{ runner.temp }}/go-unit.XXXXXX")"
          json_log="$temp_dir/unit-tests.jsonl"
          err_log="$temp_dir/unit-tests.err"
          umask "$prev_umask"
          cleanup() {
            trap - EXIT INT TERM
            c_status=0
            rm -f "$json_log" "$err_log" 2>/dev/null || c_status=1
            rmdir "$temp_dir" 2>/dev/null || c_status=1
            if [ "$c_status" -ne 0 ]; then
              echo "Failed to safely remove runner unit test directory." >&2
              return 1
            fi
            return 0
          }
          trap 'cleanup || exit 1' EXIT
          trap 'cleanup; exit 130' INT
          trap 'cleanup; exit 143' TERM

          test_exit=0
          go test -json -race -count=1 -coverprofile=coverage.out ./... > "$json_log" 2> "$err_log" || test_exit=$?

          guard_exit=0
          python3 ../scripts/ci_go_test_guard.py \
            --input "$json_log" \
            --require 'iot-platform/internal/config:TestAdminMaxBodyBytes' \
            --require 'iot-platform/internal/gateway:TestAdminGatewayServiceValidationAndBounds' \
            --require 'iot-platform/internal/gateway:TestAdminGatewayServiceQueryNormalizationAndExecution' \
            --require 'iot-platform/internal/gateway:TestPostgresAdminGatewayRepository' \
            --require 'iot-platform/internal/gateway:TestInventoryReadErrorClassificationAndPreservation' \
            --require 'iot-platform/internal/gateway:TestOwnerSensorProvisioningServiceValidation' \
            --require 'iot-platform/internal/gateway:TestPostgresProvisioningConstructorAndSensorValidation' \
            --require 'iot-platform/internal/gateway:TestPostgresOwnerSensorProvisioningUnitAuthorizationBranches' \
            --require 'iot-platform/internal/httpserver:TestAdminGatewayInventoryHTTPHandler' \
            --require 'iot-platform/internal/httpserver:TestAdminGatewayInventoryAuditLogging' \
            --require 'iot-platform/internal/httpserver:TestRegisteredAdminLookupFailure' \
            --require 'iot-platform/internal/httpserver:TestOwnerSensorProvisioningHTTPHandler' \
            --require 'iot-platform/internal/httpserver:TestOwnerSensorPreflightAndCacheControlHeaders' \
            --require 'iot-platform/internal/httpserver:TestCredentialRoutesAuthorization' \
            --require 'iot-platform/internal/httpserver:TestCredentialRequestValidation' \
            --require 'iot-platform/internal/httpserver:TestCredentialResetRoute_SuccessAndErrors' \
            --require 'iot-platform/internal/mqttcredential:TestSimplifiedDynSecExecutor_ConfigValidation' \
            --require 'iot-platform/internal/mqttcredential:TestSimplifiedDynSecExecutor_TargetGuards' \
            --require 'iot-platform/internal/mqttcredential:TestSimplifiedDynSecExecutor_Provision_Success' \
            --require 'iot-platform/internal/mqttcredential:TestSimplifiedDynSecExecutor_Rotate_Success' \
            --require 'iot-platform/internal/mqttcredential:TestSimplifiedDynSecExecutor_Reset_Success' \
            --require 'iot-platform/internal/mqttcredential:TestSimplifiedService_Orchestration' \
            --require 'iot-platform/internal/mqttcredential:TestSimplifiedService_ConstructorAndGuards' \
            --require 'iot-platform/internal/mqttcredential:TestSimplifiedStartupClassifier_InvalidOptions' \
            --require 'iot-platform/internal/mqttcredential:TestSimplifiedStartupClassifier_EmptyScan' \
            --allow-no-test-package 'iot-platform/cmd/gateway' || guard_exit=$?

          if [ "$test_exit" -ne 0 ]; then
            echo "Go unit test suite execution failed with exit code $test_exit." >&2
            cleanup || exit 1
            trap - EXIT INT TERM
            exit "$test_exit"
          fi

          if [ "$guard_exit" -ne 0 ]; then
            echo "CI test guard verification failed with exit code $guard_exit." >&2
            cleanup || exit 1
            trap - EXIT INT TERM
            exit "$guard_exit"
          fi

          cleanup || exit 1
          trap - EXIT INT TERM
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: src/coverage.out

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: src/go.sum
      - name: Build server (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/server
      - name: Build gateway (linux/armv7)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null ./cmd/gateway
      - name: Build legacy tools
        run: |
          for arch in amd64 arm; do
            for command in mosquitto-auth-init mosquitto-reloader; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" GOARM=7 go build -o /dev/null "./cmd/$command"
            done
          done

  migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test migration harness
        run: |
          mkdir -p /tmp/opencode
          python3 -m unittest scripts/tests/test_ci_migration19.py scripts/tests/test_migration_ci_compat.py scripts/tests/test_ci_migration_job.py
      - name: Pull database image
        run: docker pull --platform linux/amd64 timescale/timescaledb@sha256:289d55704b1b3ee8263cd3805c6930f9cd54506835a8f19f9b85dad17d5c5a8a
      - name: Verify migrations
        run: timeout --signal=TERM --kill-after=90s 600s sh scripts/test-stage2-migrations.sh
      - name: Verify Supabase compatibility
        run: timeout --signal=TERM --kill-after=90s 240s python3 scripts/tests/migration_ci_compat.py

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          target: backend
          push: false
          load: true
          tags: iot-backend:ci
      - name: Smoke test backend
        working-directory: .
        env:
          STAGE2_BACKEND_IMAGE: iot-backend:ci
        run: sh scripts/test-backend-smoke.sh

  legacy-runtime-image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build legacy initializer
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          target: auth-init
          push: false
      - name: Build legacy reloader
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          target: reloader
          push: false

  authorization-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: src/go.sum
      - name: Prepare test directory
        working-directory: .
        run: mkdir -p /tmp/opencode
      - name: Test authorization
        working-directory: .
        env:
          AUTHORIZATION_TEST_COVERAGE_FILE: ${{ runner.temp }}/authorization-coverage.out
        run: sh scripts/test-stage2-authorization.sh
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: authorization-coverage
          path: ${{ runner.temp }}/authorization-coverage.out

  provisioning-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: src/go.sum
      - name: Prepare test directory
        working-directory: .
        run: mkdir -p /tmp/opencode
      - name: Test provisioning
        working-directory: .
        env:
          PROVISIONING_TEST_COVERAGE: ${{ runner.temp }}/provisioning-coverage.out
        run: sh scripts/test-stage2-provisioning.sh
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: provisioning-coverage
          path: ${{ runner.temp }}/provisioning-coverage.out

  auth-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: src/go.sum
      - name: Test Auth harness
        working-directory: .
        run: python3 -m unittest discover -s scripts/tests -p 'test_stage2_auth.py'
      - name: Test Auth integration
        working-directory: .
        run: sh scripts/test-stage2-auth.sh
      - name: Test admin checker
        working-directory: .
        run: sh scripts/test-stage2-admin.sh

  mosquitto-credential-integration:
    name: Legacy credential checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: src/go.sum
      - name: Prepare coverage directory
        run: mkdir -p /tmp/opencode
      - name: Test credential harness
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_stage2_mqtt_credentials.py'
          python3 -m unittest discover -s scripts/tests -p 'test_task2612_standalone.py'
      - name: Legacy credential execution deferred notice
        run: |
          notice=$(printf '%s\n' \
            "legacy-execution-deferred: mosquitto-credential-integration" \
            "Omitted native scenario: legacy credential lifecycle and controller standalone integration." \
            "Known unresolved failure: standalone controller gate mismatch source-proven (cmd/server does not call legacy OpenVerified); gate closed." \
            "Current replacement verification jobs: dynsec-native-integration and native-compose-smoke.")
          printf '%s\n' "$notice"
          printf '%s\n' "$notice" >> "$GITHUB_STEP_SUMMARY"
      - name: Lint credentials
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ./src
          args: --timeout=5m
      - name: Build legacy controller
        run: |
          docker build --target backend -t task2612-backend:ci src
          docker build --target credential-controller -t task2612-controller:ci src

  mosquitto-runtime-integration:
    name: Legacy runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: src/go.sum
      - name: Prepare test directory
        run: mkdir -p /tmp/opencode
      - name: Test runtime harness
        run: python3 -m unittest discover -s scripts/tests -p 'test_stage2_mosquitto_runtime.py'
      - name: Legacy runtime execution deferred notice
        run: |
          notice=$(printf '%s\n' \
            "legacy-execution-deferred: mosquitto-runtime-integration" \
            "Omitted native scenario: legacy runtime reloader integration." \
            "Known unresolved failure: historical fault-lost-ack exit 2 root cause unknown (deferred due to legacy file/reloader adapter path, not bug fix)." \
            "Current replacement verification jobs: dynsec-native-integration and native-compose-smoke.")
          printf '%s\n' "$notice"
          printf '%s\n' "$notice" >> "$GITHUB_STEP_SUMMARY"

  dynsec-native-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - name: Prepare native report path
        run: |
          printf 'DYNSEC_NATIVE_REPORT=%s/dynsec-native-%s-%s.json\n' \
            "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: src/go.sum
      - name: Test native harness
        run: |
          mkdir -p /tmp/opencode
          python3 -m unittest scripts/tests/test_ci_feature_jobs.py scripts/tests/test_dynsec_native_ci.py scripts/tests/test_task28_rotate_revoke_native.py scripts/tests/test_task28_simplified_schema_runner.py scripts/tests/test_task28_disable_client_probe.py
      - name: Pull native images
        run: |
          docker pull --platform linux/amd64 timescale/timescaledb@sha256:289d55704b1b3ee8263cd3805c6930f9cd54506835a8f19f9b85dad17d5c5a8a
          docker pull --platform linux/amd64 eclipse-mosquitto@sha256:d12c8f80dfc65b768bb9acecc7ef182b976f71fb681640b66358e5e0cf94e9e9
      - name: Test native DynSec
        run: |
          # Owned fixtures are torn down in-process. Cancellation is best effort,
          # not a guarantee for hung children or forced runner termination.
          python3 scripts/tests/dynsec_native_ci.py --report "$DYNSEC_NATIVE_REPORT"
          python3 scripts/tests/dynsec_native_ci.py --validate-report "$DYNSEC_NATIVE_REPORT"
      - name: Upload safe report
        uses: actions/upload-artifact@v4
        with:
          name: dynsec-native-safe-report
          path: ${{ runner.temp }}/dynsec-native-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error

  dynsec-bootstrap-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - name: Prepare bootstrap report path
        run: |
          printf 'DYNSEC_BOOTSTRAP_REPORT=%s/dynsec-bootstrap-%s-%s.json\n' \
            "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Test bootstrap harness
        run: |
          mkdir -p /tmp/opencode
          python3 -m unittest scripts/tests/test_task284_bootstrap.py scripts/tests/test_dynsec_bootstrap_cli.py
      - name: Pull broker image
        run: docker pull --platform linux/amd64 eclipse-mosquitto@sha256:d12c8f80dfc65b768bb9acecc7ef182b976f71fb681640b66358e5e0cf94e9e9
      - name: Test bootstrap
        run: |
          # Pipeline verifies store creation, strict default deny ACLs, role literals,
          # and exact volume cleanup in-process. Signal interruption initiates bounded teardown.
          python3 scripts/tests/dynsec_bootstrap_cli.py --report "$DYNSEC_BOOTSTRAP_REPORT"
      - name: Validate bootstrap report
        run: |
          python3 -c '
          import json, re, sys
          from pathlib import Path
          from scripts.tests.dynsec_bootstrap_cli import (
              PINNED_DIGEST,
              PINNED_IMAGE,
              SAFE_REPORT_KEYS,
          )

          path = Path(sys.argv[1])
          if path.is_symlink() or not path.is_file():
              sys.exit("report file missing or symlink")
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              sys.exit("invalid report JSON")
          if not isinstance(data, dict) or set(data.keys()) != set(SAFE_REPORT_KEYS):
              sys.exit("report schema mismatch")
          if data.get("status") != "success" or data.get("mode") != "container":
              sys.exit("report status or mode contract violated")
          if data.get("runtime_status") != "NOT_READY" or data.get("ownership") != "1883:1883":
              sys.exit("runtime status or ownership contract violated")
          if data.get("cleaned_up") is not True or type(data.get("cleaned_up")) is not bool:
              sys.exit("cleanup verification incomplete")
          if data.get("collision_rejected") is not True or type(data.get("collision_rejected")) is not bool:
              sys.exit("collision verification incomplete")
          if data.get("image_ref") != PINNED_IMAGE or data.get("image_digest") != "sha256:" + PINNED_DIGEST:
              sys.exit("immutable image contract violated")
          run_nonce = data.get("run_nonce")
          volume_name = data.get("volume_name")
          if (not isinstance(run_nonce, str) or not re.fullmatch(r"[0-9a-f]{32}", run_nonce) or
                  not isinstance(volume_name, str) or volume_name != f"mosquitto_dynsec_{run_nonce[:24]}"):
              sys.exit("run nonce or volume name contract violated")
          assertions = data.get("assertions_checked")
          if type(assertions) is not int or assertions < 17:
              sys.exit("assertions count contract violated")
          print("Bootstrap report validated successfully")
          ' "$DYNSEC_BOOTSTRAP_REPORT"
      - name: Upload safe report
        uses: actions/upload-artifact@v4
        with:
          name: dynsec-bootstrap-safe-report
          path: ${{ runner.temp }}/dynsec-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error

  native-compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-test, migration-check, dynsec-native-integration, dynsec-bootstrap-tests]
    defaults:
      run:
        working-directory: .
    env:
      SMOKE_PREPARE_DIR: /tmp/opencode/native-compose-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: src/go.sum
      - name: Check prerequisites
        run: |
          mkdir -p /tmp/opencode
          python3 --version
          openssl version
          which setfacl getfacl
          docker version
          docker compose version
          go version
      - name: Test smoke harness
        run: python3 -m unittest scripts/tests/test_native_compose_smoke.py scripts/tests/test_ci_smoke_jobs.py
      - name: Pull runtime images
        run: |
          docker pull --platform linux/amd64 timescale/timescaledb@sha256:289d55704b1b3ee8263cd3805c6930f9cd54506835a8f19f9b85dad17d5c5a8a
          docker pull --platform linux/amd64 eclipse-mosquitto@sha256:d12c8f80dfc65b768bb9acecc7ef182b976f71fb681640b66358e5e0cf94e9e9
          docker pull --platform linux/amd64 nginx:1.25-alpine
          docker pull --platform linux/amd64 supabase/gotrue:v2.196.0
          docker pull --platform linux/amd64 envoyproxy/envoy:v1.39.1
      - name: Run Compose smoke
        id: smoke
        run: |
          # The runner creates private isolated fixtures under SMOKE_PREPARE_DIR,
          # builds its own backend from src/Dockerfile, executes 14 role denials,
          # 9 JWT missing/invalid/expired cases, positive slice, and verifies exact cleanup.
          python3 scripts/tests/native_compose_smoke.py --prepare "$SMOKE_PREPARE_DIR" --full-http
      - name: Validate smoke report
        run: |
          python3 -c '
          import json, sys
          from pathlib import Path
          from scripts.tests.native_compose_smoke import validate_summary

          report_path = Path(sys.argv[1])
          if report_path.is_symlink() or not report_path.exists():
              sys.exit("report file missing or symlink")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          validate_summary(report)
          if report.get("status") != "RBAC_JWT_HTTP_ACCEPTED" or report.get("http_accepted") is not True:
              sys.exit("smoke run did not reach RBAC_JWT_HTTP_ACCEPTED status")
          if report.get("exact_cleanup_verified") is not True:
              sys.exit("exact cleanup was not verified")
          print("Native compose smoke summary validated successfully")
          ' "$SMOKE_PREPARE_DIR/artifacts/startup-summary.json"
      - name: Upload safe report
        uses: actions/upload-artifact@v4
        with:
          name: native-compose-smoke-safe-report
          path: /tmp/opencode/native-compose-smoke-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/startup-summary.json
          if-no-files-found: error
      - name: Validate smoke failure report
        id: failure_diagnostic
        if: always() && steps.smoke.outcome == 'failure'
        run: |
          python3 -c '
          import json, os, sys
          from pathlib import Path
          from scripts.tests.native_compose_smoke import validate_failure_report

          source_path = Path(sys.argv[1])
          staging_path = Path(sys.argv[2])
          staging_dir = staging_path.parent
          staging_dir.mkdir(parents=True, exist_ok=True)

          if staging_path.exists() or staging_path.is_symlink():
              staging_path.unlink()

          if not source_path.exists() and not source_path.is_symlink():
              print("::warning::Smoke failure report missing; no diagnostic artifact will be uploaded", file=sys.stderr)
              sys.exit(0)

          if source_path.is_symlink() or not source_path.is_file():
              sys.exit("invalid failure report: not a regular file")

          try:
              size = source_path.stat().st_size
          except Exception:
              sys.exit("unable to inspect failure report size")
          if size <= 0 or size > 8192:
              sys.exit("failure report size out of bounds")

          try:
              report = json.loads(source_path.read_text(encoding="utf-8"))
          except Exception:
              sys.exit("invalid failure report JSON")

          try:
              validate_failure_report(report)
          except Exception:
              sys.exit("failure report validation failed")

          validated_fields = {
              "schema_version": int(report["schema_version"]),
              "status": str(report["status"]),
              "phase": str(report["phase"]),
              "error_type": str(report["error_type"]),
              "error_code": str(report["error_code"]),
              "http_accepted": bool(report["http_accepted"]),
              "cleanup_verified": bool(report["cleanup_verified"]),
              "primary_phase": str(report["primary_phase"]) if report["primary_phase"] is not None else None,
              "primary_error_code": str(report["primary_error_code"]) if report["primary_error_code"] is not None else None,
              "cleanup_step": str(report["cleanup_step"]) if report["cleanup_step"] is not None else None,
              "cleanup_error_code": str(report["cleanup_error_code"]) if report["cleanup_error_code"] is not None else None,
              "resource_kind": str(report["resource_kind"]) if report["resource_kind"] is not None else None,
          }

          try:
              validate_failure_report(validated_fields)
          except Exception:
              sys.exit("failure report validation failed")

          staging_path.write_text(json.dumps(validated_fields, indent=2) + "\n", encoding="utf-8")

          github_output = os.getenv("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write("validated=true\n")

          print("Smoke failure diagnostic validated successfully")
          ' "$SMOKE_PREPARE_DIR/artifacts/smoke-failure.json" "${{ runner.temp }}/smoke-failure-staging/smoke-failure.json"
      - name: Upload safe failure report
        if: always() && steps.smoke.outcome == 'failure' && steps.failure_diagnostic.outcome == 'success' && steps.failure_diagnostic.outputs.validated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-compose-smoke-safe-failure-report
          path: ${{ runner.temp }}/smoke-failure-staging/smoke-failure.json
          if-no-files-found: error
