# Compatibility overlay for the isolated Stage 8 fixture. Operators can use
# the stage8-media profile in docker-compose.yml directly.
services:
  stage8-media-upload:
    environment:
      MEDIA_UPLOAD_ROUTE_KEY: ${MEDIA_UPLOAD_ROUTE_KEY:?fixture/operator route key required}
    volumes: !override
      - ./config/nginx/stage8-media.conf.template:/etc/nginx/templates/default.conf.template:ro
  nginx:
    ports: !override
      - target: 80
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      MEDIA_UPLOAD_ENABLED: ${MEDIA_UPLOAD_ENABLED:-false}
      MEDIA_UPLOAD_ROUTE_KEY: ${MEDIA_UPLOAD_ROUTE_KEY:-}
      MEDIA_PLAYBACK_ENABLED: ${MEDIA_PLAYBACK_ENABLED:-false}
      MEDIA_PLAYBACK_ROUTE_KEY: ${MEDIA_PLAYBACK_ROUTE_KEY:-}
    volumes: !override
      - ./config/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./config/nginx/stage8-media-playback.conf.template:/etc/nginx/templates/stage8-media-playback.conf.template:ro
      - ./config/nginx/18-validate-playback-key.envsh:/docker-entrypoint.d/18-validate-playback-key.envsh:ro
    networks: !override
      iot_net:
        aliases:
          - stage8-shared-nginx
    depends_on:
      backend:
        condition: service_healthy
      supabase-envoy:
        condition: service_started
  # Fixture-only TLS edge models Cloudflare termination, then proxies over HTTP
  # to the shared API Nginx origin. Never included by the root Compose profile.
  stage8-media-upload-test-edge:
    image: nginx:1.25-alpine
    restart: "no"
    ports:
      - target: 443
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - ./config/nginx/stage8-media-test-edge.conf.template:/etc/nginx/templates/default.conf.template:ro
      - type: bind
        source: ${MEDIA_TEST_TLS_DIR:?fixture TLS directory required}
        target: /etc/nginx/stage8-tls
        read_only: true
        bind:
          create_host_path: false
      - ./docs/examples/media-playback/index.html:/var/www/demo/index.html:ro
      - ./docs/examples/media-playback/player.js:/var/www/demo/player.js:ro
    networks:
      - iot_net
    depends_on:
      nginx:
        condition: service_started
  # Fixture-only TLS edge models public TLS termination for playback, then proxies over HTTP
  # to the internal Nginx playback listener (port 8081). Never included by the root Compose profile.
  stage8-media-playback-test-edge:
    image: nginx:1.25-alpine
    restart: "no"
    ports:
      - target: 443
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - ./config/nginx/stage8-media-playback-test-edge.conf.template:/etc/nginx/templates/default.conf.template:ro
      - type: bind
        source: ${MEDIA_TEST_TLS_DIR:?fixture TLS directory required}
        target: /etc/nginx/stage8-tls
        read_only: true
        bind:
          create_host_path: false
    networks:
      - iot_net
    depends_on:
      nginx:
        condition: service_started
  supabase-envoy:
    environment:
      MEDIA_UPLOAD_ROUTE_KEY: ${MEDIA_UPLOAD_ROUTE_KEY:?fixture/operator route key required}
      MEDIA_PLAYBACK_ROUTE_KEY: ${MEDIA_PLAYBACK_ROUTE_KEY:-}
      MEDIA_PLAYBACK_ENABLED: ${MEDIA_PLAYBACK_ENABLED:-false}
  supabase-storage:
    environment:
      FILE_SIZE_LIMIT: 80000000
      # v1.74 serializes request URLs with `token` redacted; fatal keeps signed
      # upload request logs out of this local proof profile entirely.
      LOG_LEVEL: fatal
