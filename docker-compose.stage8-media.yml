# Local-only media opt-in. Apply alongside docker-compose.yml; the base Storage
# limit stays unchanged for all existing profiles and deployments.
services:
  backend:
    environment:
      MEDIA_UPLOAD_MQTT_CLIENT_ID: ${MEDIA_UPLOAD_MQTT_CLIENT_ID:-backend_media}
      MEDIA_UPLOAD_SIGN_TIMEOUT: ${MEDIA_UPLOAD_SIGN_TIMEOUT:-5s}
      MEDIA_UPLOAD_GRANT_TTL_SECONDS: ${MEDIA_UPLOAD_GRANT_TTL_SECONDS:-60}
      MEDIA_UPLOAD_INFLIGHT_GRACE: ${MEDIA_UPLOAD_INFLIGHT_GRACE:-2m}
      MEDIA_UPLOAD_REQUEST_WORKERS: ${MEDIA_UPLOAD_REQUEST_WORKERS:-2}
      STORAGE_INTERNAL_URL: ${STORAGE_INTERNAL_URL:-http://supabase-storage:5000}
      MEDIA_UPLOAD_PUBLIC_ORIGIN: ${MEDIA_UPLOAD_PUBLIC_ORIGIN:-}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-}
      MQTT_TLS_CA_FILE: ${MQTT_TLS_CA_FILE:-}
      MQTT_INTERNAL_MANAGEMENT_URL: ${MQTT_INTERNAL_MANAGEMENT_URL:-ssl://mosquitto:8883}
      MQTT_DYNSEC_MANAGER_USERNAME: ${MQTT_DYNSEC_MANAGER_USERNAME:-}
      MQTT_DYNSEC_MANAGER_PASSWORD: ${MQTT_DYNSEC_MANAGER_PASSWORD:-}
  stage8-media-upload:
    image: nginx:1.25-alpine
    restart: "no"
    ports: !override
      - target: 443
        published: "${MEDIA_HTTPS_PORT:-0}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      MEDIA_UPLOAD_ROUTE_KEY: ${MEDIA_UPLOAD_ROUTE_KEY:?fixture/operator route key required}
    volumes: !override
      - ./config/nginx/stage8-media.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${MEDIA_TLS_DIR:?fixture/operator TLS directory required}:/etc/nginx/stage8-tls:ro
    networks:
      - iot_net
    depends_on:
      supabase-envoy:
        condition: service_started
    labels:
      io.iot.stage: stage8-media-upload
  supabase-envoy:
    environment:
      MEDIA_UPLOAD_ROUTE_KEY: ${MEDIA_UPLOAD_ROUTE_KEY:?fixture/operator route key required}
  supabase-storage:
    environment:
      FILE_SIZE_LIMIT: 80000000
      UPLOAD_SIGNED_URL_EXPIRATION_TIME: ${MEDIA_UPLOAD_GRANT_TTL_SECONDS:-60}
      # v1.74 serializes request URLs with `token` redacted; fatal keeps signed
      # upload request logs out of this local proof profile entirely.
      LOG_LEVEL: fatal
