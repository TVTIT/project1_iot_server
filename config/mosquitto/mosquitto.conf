# Mosquitto Broker Configuration for IoT Gateway-Server Project
# Dynamic Security topology (pinned Eclipse Mosquitto image reports 2.0.18)
# Base Port: 1883 (Plain TCP internal/debug) & 8883 (TLS)

listener 1883 0.0.0.0

listener 8883 0.0.0.0
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate false
tls_version tlsv1.2

# Dynamic Security Plugin
# Uses native store in dedicated private directory.
# Credentials and ACLs are managed dynamically via DynSec plugin.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/dynsec/dynamic-security.json

# Authentication & Authorization
allow_anonymous false

# Packet and PUBLISH payload limits (bytes). max_packet_size covers the complete
# MQTT packet, including topic/header overhead; message_size_limit covers only a
# PUBLISH payload. Application ingress defaults to 64 KiB and supports up to
# 1 MiB, so retain headroom for topic, MQTT headers and properties.
max_packet_size 2097152
message_size_limit 1048576

# Outgoing QoS 1/2 flow controls. Mosquitto applies these globally as limits per
# client: in-flight is separate from queued delivery. Byte limits are not strict
# allocation caps for a single message larger than the byte threshold; such a
# message may still be sent alone. Keep count and byte limits finite together.
max_inflight_messages 20
max_inflight_bytes 1048576
max_queued_messages 256
max_queued_bytes 16777216

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
