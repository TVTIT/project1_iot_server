# Mosquitto Broker Configuration for IoT Gateway-Server Project
# Dynamic Security topology (Eclipse Mosquitto 2.0.18)
# Base Port: 1883 (Plain TCP internal/debug) & 8883 (TLS)

listener 1883 0.0.0.0

listener 8883 0.0.0.0
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate false
tls_version tlsv1.2

# Dynamic Security Plugin
# Uses native store in dedicated private directory.
# Credentials and ACLs are managed dynamically via DynSec plugin.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/dynsec/dynamic-security.json

# Authentication & Authorization
allow_anonymous false

# Packet and PUBLISH payload size limits (bytes). These are finite server-side
# allocation bounds for the pinned broker: max_packet_size bounds the largest
# accepted MQTT control packet (including topic and MQTT headers), and
# message_size_limit bounds a single PUBLISH payload. The application-level
# ingress limit is 64 KiB by default (supported maximum 1 MiB), so the packet
# bound must stay above that payload plus topic and headers; it is deliberately
# larger than message_size_limit and never equal to it.
max_packet_size 2097152
message_size_limit 1048576

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
