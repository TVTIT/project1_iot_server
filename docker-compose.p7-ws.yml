# Explicit P7 WebSocket perimeter opt-in. Use after the base Compose file.
services:
  backend:
    environment:
      WEBSOCKET_ENABLED: 'true'
      AUTH_UNIX_SOCKET_PATH: /run/iot-auth/auth.sock
    group_add:
      - '101' # Nginx worker group in the pinned nginx:1.25-alpine image.
    volumes:
      - auth_socket_p7:/run/iot-auth
    depends_on:
      auth-socket-p7-init:
        condition: service_completed_successfully

  nginx:
    volumes: !override
      - ./config/nginx/paper-p7-ws.conf.template:/etc/nginx/templates/default.conf.template:ro
      - auth_socket_p7:/run/iot-auth:ro

  # Root is used only to initialize this new, dedicated named volume. No host
  # paths or existing/shared volumes are chmod'ed.
  auth-socket-p7-init:
    image: eclipse-mosquitto@sha256:d12c8f80dfc65b768bb9acecc7ef182b976f71fb681640b66358e5e0cf94e9e9
    user: '0:0'
    cap_drop: [ ALL ]
    cap_add: [ CHOWN, FOWNER, FSETID ]
    security_opt: [ no-new-privileges:true ]
    read_only: true
    entrypoint: [ /bin/sh ]
    command: [ -ec, 'chown 1883:101 /run/iot-auth && chmod 2710 /run/iot-auth' ]
    restart: 'no'
    volumes:
      - auth_socket_p7:/run/iot-auth

volumes:
  auth_socket_p7:
